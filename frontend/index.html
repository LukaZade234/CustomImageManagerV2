    <title>ImgManager — Mudae custom image helper</title>
    <script>
      /* Runs before first paint so an explicit theme choice never flashes the
         other theme. No attribute at all means "follow the OS". */
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          var legacy = localStorage.getItem('darkMode');
          t = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light' : null;
        }
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* private mode / blocked storage */ }
    </script>
  </head>
